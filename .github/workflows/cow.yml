name: MIT 6.1810 2026 COW
on:
  push:
    branches: [edidada/cow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch python3 bc
      - name: Original full grade
        run: |
          set -o pipefail
          make grade TOOLPREFIX=riscv64-linux-gnu- 2>&1 | tee cow-grade.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          assert re.search(r'Score:\s*130/130',Path('cow-grade.txt').read_text())
          assert 'ALL TESTS PASSED' in Path('xv6.out').read_text()
          PY
      - name: Independent sharing, cross-page copyout, lazy holes and exhaustion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from gradelib import Runner, save, shell_script, test, run_tests
          Path('evidence').mkdir(exist_ok=True)
          r=Runner(save('evidence/cow-runtime.txt'))
          @test(1, 'independent cow boundaries')
          def test_extra():
              r.run_qemu(shell_script(['cowtest','cowextra']),timeout=180)
              r.match('^ALL COW TESTS PASSED','^cowextra: PASS 32 fork-copyout cases, lazy isolation and OOM fault',no=['cowextra: FAIL','panic:','OOM write unexpectedly'])
              Path('evidence/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          run_tests()
          PY
      - name: GDB proves physical sharing and write-fault split
        run: bash scripts/inspect_cow.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-2026-results
          path: |
            cow-grade.txt
            xv6.out*
            evidence/
