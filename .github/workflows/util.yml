name: MIT 6.1810 2026 util
on:
  push:
    branches: [edidada/util]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch python3 bc
      - name: Full official grade
        run: |
          set -o pipefail
          make grade TOOLPREFIX=riscv64-linux-gnu- 2>&1 | tee util-grade.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('util-grade.txt').read_text()
          matches=re.findall(r'Score:\s*(\d+)\s*/\s*(\d+)',text)
          assert matches and matches[-1][0]==matches[-1][1],text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: util-2026-results
          path: |
            util-grade.txt
            xv6.out*
