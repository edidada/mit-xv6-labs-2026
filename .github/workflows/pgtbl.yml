name: MIT 6.1810 2026 pgtbl
on:
  push:
    branches: [edidada/pgtbl]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch python3 bc
      - name: Original full grade
        run: |
          set -o pipefail
          make grade TOOLPREFIX=riscv64-linux-gnu- 2>&1 | tee pgtbl-grade.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('pgtbl-grade.txt').read_text()
          assert re.search(r'Score:\s*46/46',text),text
          assert 'ALL TESTS PASSED' in Path('xv6.out').read_text()
          PY
      - name: Page table explanations and independent boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          from gradelib import Runner, save, shell_script, test, run_tests
          Path('evidence').mkdir(exist_ok=True)
          r=Runner(save('evidence/page-tables.txt'))
          @test(1, 'independent page table boundaries')
          def test_extra():
              r.run_qemu(shell_script(['pgtbltest','pgextra','echo EXTRADONE']),timeout=60)
              r.match('^pgtbltest: all tests succeeded','^pgextra: PASS boundaries, clear, output width, RO/NX and exec',no=['pgextra: FAIL','panic:'])
              text=r.qemu.output
              m=re.search(r'pgextra: kernel super=(\d+) regular=(\d+) saved_table_pages=(\d+)',text)
              assert m,text
              assert int(m[1]) >= 93 and m[1] == m[3]
              entries=re.findall(r'^va (0x[0-9a-f]+) pte (0x[0-9a-f]+) pa (0x[0-9a-f]+) perm (0x[0-9a-f]+)',text,re.M|re.I)
              assert len(entries)==20,entries
              Path('evidence/results.json').write_text(json.dumps({'superpages':int(m[1]),'regular_leaf_ptes':int(m[2]),'saved_bottom_table_pages':int(m[3]),'page_table_entries':entries,'boundaries':'passed'},indent=2)+'\n')
              Path('evidence/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          run_tests()
          PY
      - name: Independent complete kernel map inspection
        run: bash scripts/inspect_kernel_pgtbl.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgtbl-2026-results
          path: |
            pgtbl-grade.txt
            xv6.out*
            evidence/
